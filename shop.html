<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Nostra</title>
 <link href="./src/output.css" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="antialiased">

  <!-- Nav -->
  <header class="sticky top-0 z-50 bg-[#F3EFE7]/90 backdrop-blur border-b border-black/10">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 flex items-center justify-between h-20">
      <a href="index.html" class="font-display text-2xl tracking-[0.15em]">NOSTRA</a>
      <nav class="hidden md:flex items-center gap-10 text-sm uppercase tracking-wider">
        <a href="index.html" class="link-draw">Home</a>
        <a href="shop.html" class="link-draw text-[#C9A15A]">Shop</a>
        <a href="about.html" class="link-draw">About</a>
        <a href="contact.html" class="link-draw">Contact</a>
      </nav>
      <div class="hidden md:flex items-center gap-6">
        <button class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span id="cartCount" class="absolute -top-2 -right-2 bg-black text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </button>
      </div>
      <button id="menuBtn" class="md:hidden" aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden border-t border-black/10 bg-[#F3EFE7] px-5 py-4 space-y-4 text-sm uppercase tracking-wider">
      <a href="index.html" class="block">Home</a>
      <a href="shop.html" class="block">Shop</a>
      <a href="about.html" class="block">About</a>
      <a href="contact.html" class="block">Contact</a>
    </div>
  </header>

  <!-- Page banner -->
  <section class="bg-[#14171C] text-[#F3EFE7] py-14 text-center px-5">
    <p class="uppercase tracking-[0.3em] text-xs text-[#C9A15A] mb-3">Full Collection</p>
    <h1 class="font-display italic text-4xl">The Shop</h1>
  </section>

  <!-- Main -->
  <main class="max-w-7xl mx-auto px-5 sm:px-8 py-12">
    <div class="flex flex-col lg:flex-row gap-10">

      <!-- Filters -->
      <aside class="lg:w-1/5 w-full">
        <div class="flex lg:flex-col justify-between items-center lg:items-start gap-4">
          <h2 class="font-display text-lg">Filters</h2>
          <button id="clearFilters" class="text-xs text-[#8A8578] underline lg:hidden">Clear</button>
        </div>
        <div class="mt-5">
          <h3 class="text-xs uppercase tracking-wider mb-3 text-[#8A8578]">Category</h3>
          <div id="categoryFilters" class="flex flex-wrap lg:flex-col gap-2">
            <button data-category="all" class="filter-btn text-sm px-4 py-1.5 rounded-full border border-black/20 text-left">All</button>
            <button data-category="bags" class="filter-btn text-sm px-4 py-1.5 rounded-full border border-black/20 text-left">Bags</button>
            <button data-category="footwear" class="filter-btn text-sm px-4 py-1.5 rounded-full border border-black/20 text-left">Footwear</button>
            <button data-category="accessories" class="filter-btn text-sm px-4 py-1.5 rounded-full border border-black/20 text-left">Accessories</button>
            <button data-category="apparel" class="filter-btn text-sm px-4 py-1.5 rounded-full border border-black/20 text-left">Apparel</button>
          </div>
        </div>
        <button id="clearFiltersDesktop" class="hidden lg:block mt-6 text-xs text-[#8A8578] underline">Clear filters</button>
      </aside>

      <!-- Grid -->
      <section class="flex-1">
        <div class="flex items-center justify-between mb-6">
          <p id="resultCount" class="text-sm text-[#8A8578]">Showing all products</p>
          <select id="sortSelect" class="text-sm border border-black/20 rounded-md px-3 py-1.5 bg-transparent">
            <option value="default">Sort: Featured</option>
            <option value="low-high">Price: Low to High</option>
            <option value="high-low">Price: High to Low</option>
          </select>
        </div>

        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6"></div>
        <p id="emptyState" class="hidden text-center text-[#8A8578] py-16">No products found in this category.</p>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-black/10 bg-[#14171C] text-[#F3EFE7]">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 py-10 text-center text-xs text-[#8A8578]">
      &copy; <span id="year"></span> Nostra. All rights reserved.
    </div>
  </footer>

  <script src="main.js"></script>
  <script src="products.js"></script>
</body>
</html>
